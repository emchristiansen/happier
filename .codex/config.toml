project_doc_max_bytes = 98304

developer_instructions = """
# Codex-only subagent context policy

- Every subagent spawn must set fork_turns explicitly; never rely on the tool default.
- Default to fork_turns="none".
- Use a small bounded value such as "1", "2", or "3" only when specific recent turns are required.
- Use fork_turns="all" only for a true continuation that requires the complete parent transcript, and state why in the spawn brief.
- With fork_turns="none", give a detailed self-contained brief: goal, observed evidence, exact paths/symbols, success criteria, constraints/permissions, required validation, expected output, and stop/fallback rules.
- Refer to large logs and artifacts by path with a short digest; do not paste them into the child brief.

# Codex long-operation waits and resumption

- Apply the task-local waiting and recovery policy in AGENTS.md. Prefer actual completion notifications; otherwise use the existing handle's interruptible wait. For operations expected to take minutes, normally request 120 seconds; after unchanged pending results, use 300 seconds where supported. Respect tool limits and timeout units (120000/300000 for milliseconds); these are waiting preferences, not operation deadlines or evidence-based stall thresholds. Use a shorter wait when interaction, failure evidence, or a time-sensitive diagnostic requires it.
- While all useful work is waiting on a healthy operation, this policy supersedes the generic periodic-commentary cadence and advice against waits longer than 60 seconds. Explain what is pending once, preserve user interruption, and report meaningful changes and terminal results promptly. Do not schedule model turns or perform status checks solely to produce commentary. Continue normal progress updates during active work.
- Use longer waits only when the tool remains responsive to completion or user interruption; do not substitute long blind sleeps. A heartbeat may end a wait early: requesting a larger timeout does not guarantee fewer model turns. Use a supported completion-only mechanism when available, and do not invent notification support or claim an unresolved runtime limitation is fixed.
- With the current agents tools, followup_task resumes an idle existing agent; send_message alone does not start it. Inspect the available tool contract if names or behavior differ. Do not replace a resumable agent merely because it hit a usage limit.

# Codex Code Mode tool staging

- Put already-known, necessary, independent, non-conflicting nested tool calls in one bounded `exec` cell. Use `Promise.all(...)` when any failure makes the stage unusable; use `Promise.allSettled(...)` when partial results remain useful, and inspect every rejection.
- Use a later `exec` cell when the next call depends on an earlier result, the work is adaptive, an approval or wait is pending, or operations conflict over shared mutable state.
- Keep bulky nested results inside the isolate when possible. Emit one compact decision-relevant projection through `text(...)`, preserving failures, exact evidence pointers, paths, IDs or handles, and output needed for verification. Do not emit complete result objects or raw output unless required or requested.
- Do not add speculative calls, broaden the investigation, or invoke tools whose results will not affect the decision merely because batching makes more calls cheap.
"""

